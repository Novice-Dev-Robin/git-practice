name: Shell Command                    # 워크플로우명
on: workflow_dispatch                  # 이벤트 트리거
jobs:                                  # task 단위
  runs:                                # job ID, 사용자 임의로 작성 가능
    runs-on: ubuntu-latest             # 실행 환경
    steps:                             # 실행 최소 단위
      - name: Check environment        # step1의 ID
        run: |                         # 아래의 여러 shell command를 실행
          echo "Current directory:"
          pwd
          echo "File list:"
          ls -la
      - name: Check file               # step2의 ID
        run: |                         # 마찬가지로 아래 명령어들 실행
          if [ -f "README.md" ]; then
            echo "File exists"
          else
            echo "File not found"
          fi
      - name: Repeat commands          # step3의 ID
        run: |
          for i in 1 2 3
          do
            echo "Test $i"
          done
      - name: Use environment variable # step4의 ID 
        env:                           # key 저장소
          MESSAGE: Hello
        run: echo "$MESSAGE" 
