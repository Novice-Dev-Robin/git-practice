name: Issue Comment when i make push event 32222615
on:
  push:
    branches: [main]

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create issue with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues" \
            -f title="Push 감지: ${GITHUB_SHA:0:7}" \
            -f body="$GITHUB_ACTOR 가 $GITHUB_REF_NAME 브랜치에 push 완료." \
            --jq '.html_url'
